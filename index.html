<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyameta Gateway</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2f1ee;
      --surface: #ffffff;
      --surface2: #f8f7f5;
      --border: #e6e4de;
      --border2: #d6d3cb;
      --text: #1a1917;
      --text2: #5a584f;
      --text3: #9a9890;
      --accent: #6b47f5;
      --accent-glow: rgba(107, 71, 245, 0.18);
      --accent-soft: rgba(107, 71, 245, 0.09);
      --success: #16a85e;
      --danger: #d93636;
      --danger-soft: rgba(217, 54, 54, 0.08);
      --danger-border: rgba(217, 54, 54, 0.18);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.09);
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .nav-mark, .login-icon, .avatar, .pay-brand-mark { background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 18px var(--accent-glow); }
    .nav-mark, .pay-brand-mark { width: 32px; height: 32px; border-radius: 8px; }
    .login-icon { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 1.25rem; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; color: #fff; font-size: 14px; font-weight: 600; flex-shrink: 0; }
    .nav-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
    .nav-name span { color: var(--accent); }
    .btn, .login-btn, .fc-btn, .pay-btn, .btn-retry, .btn-contact-pay, .contact-back-btn { font-family: 'Outfit', sans-serif; cursor: pointer; transition: all 0.15s; }
    .btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
    .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text2); }
    .btn-danger-ghost { background: transparent; border: 1px solid var(--danger-border); color: var(--danger); }
    .page { display: none; flex: 1; }
    .page.active { display: flex; }
    .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card, .modal, .pay-card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
    .login-card { border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 380px; text-align: center; }
    .login-title, .dash-title, .contact-title, .not-found h2 { font-family: 'Instrument Serif', serif; letter-spacing: -0.5px; }
    .login-title { font-size: 26px; margin-bottom: 6px; }
    .login-sub, .dash-sub, .not-found p, .loading-state { font-size: 13px; color: var(--text3); }
    .login-input, .mfield input, .pf input { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--text); outline: none; }
    .login-input { text-align: center; letter-spacing: 2px; }
    .login-err { font-size: 12px; color: var(--danger); margin-top: 8px; display: none; }
    .login-btn { width: 100%; margin-top: 1rem; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; }
    .dash-wrap { flex: 1; padding: 2rem; max-width: 1100px; margin: 0 auto; width: 100%; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .dash-title { font-size: 28px; }
    .forms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; position: relative; overflow: hidden; }
    .fc-logo, .pay-brand-img { object-fit: cover; border: 1px solid var(--border); }
    .fc-logo, .fc-logo-placeholder { width: 42px; height: 42px; border-radius: 10px; margin-bottom: 1rem; }
    .fc-logo-placeholder { background: var(--accent-soft); border: 1px solid rgba(107, 71, 245, 0.2); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--accent); }
    .fc-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .fc-product { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
    .fc-amount, .qr-amount { font-family: 'Instrument Serif', serif; letter-spacing: -1px; }
    .fc-amount { font-size: 28px; margin-bottom: 1rem; }
    .fc-slug, .amount-mono, .url-bar, .timer-label { font-family: 'JetBrains Mono', monospace; }
    .fc-slug { font-size: 11px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 1rem; }
    .fc-actions, .modal-actions, .pf-row, .fail-actions, .upi-apps { display: flex; gap: 8px; flex-wrap: wrap; }
    .fc-btn { padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; border: none; }
    .fc-btn-view { background: var(--accent); color: #fff; }
    .fc-btn-edit { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
    .fc-btn-del { background: transparent; color: var(--danger); border: 1px solid var(--danger-border); }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; color: var(--text3); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 200; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { border-radius: 20px; width: 100%; max-width: 500px; padding: 2rem; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 1.5rem; }
    .mfield { margin-bottom: 1rem; }
    .mfield label, .pf-label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
    .mfield-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pay-fullscreen { position: fixed; inset: 0; background: var(--bg); display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 2rem 1rem 4rem; z-index: 500; }
    .pay-fullscreen.active { display: flex; }
    #pay-inner { width: 100%; max-width: 480px; }
    .pay-card { width: 100%; border-radius: 24px; overflow: hidden; }
    .pay-head { padding: 1.4rem 1.75rem 1.2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .pay-brand { display: flex; align-items: center; gap: 10px; }
    .pay-brand-img { width: 32px; height: 32px; border-radius: 8px; }
    .pay-brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 1.75rem 1.2rem; }
    .step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); }
    .step-dot.active { background: var(--accent); }
    .step-dot.done { background: var(--success); }
    .step-line { flex: 1; height: 1px; background: var(--border); }
    .pay-body { padding: 1.75rem; }
    .order-summary, .qr-box, .contact-card, .user-greeting { background: var(--surface2); border: 1px solid var(--border); }
    .order-summary { border-radius: 16px; padding: 1.25rem; margin-bottom: 1.75rem; }
    .order-tag, .section-title, .ci-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); }
    .order-product { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
    .order-divider { height: 1px; background: var(--border); margin-bottom: 14px; }
    .order-total-row { display: flex; justify-content: space-between; align-items: baseline; }
    .order-total-amount { font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1; }
    .pf { margin-bottom: 1rem; }
    .req { color: var(--accent); }
    .prefix-box { width: 58px; flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text2); }
    .err-msg { font-size: 11px; color: var(--danger); margin-top: 5px; display: none; }
    .err-msg.show { display: block; }
    .pay-btn { width: 100%; padding: 15px; margin-top: 0.5rem; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .foot-note, .trouble-txt, .contact-sub { text-align: center; font-size: 11px; color: var(--text3); }
    .back-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); cursor: pointer; margin-bottom: 1.5rem; width: fit-content; }
    .user-greeting { border-radius: 10px; padding: 12px 14px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 12px; }
    .qr-box { border-radius: 16px; padding: 1.5rem; text-align: center; margin-bottom: 1.25rem; }
    .qr-amount { font-size: 30px; margin-bottom: 2px; }
    .qr-hint { font-size: 12px; color: var(--text3); margin-bottom: 1.25rem; line-height: 1.5; }
    .qr-frame { display: inline-block; padding: 16px; background: #fff; border-radius: 14px; margin-bottom: 1.25rem; }
    .qr-img { display: block; width: 176px; height: 176px; object-fit: cover; border-radius: 10px; }
    .upi-chip { font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border2); color: var(--text2); }
    .payment-status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 11px; color: var(--text2); margin-bottom: 1rem; }
    .status-ping { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .timer-track { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; margin-bottom: 6px; }
    .timer-fill { height: 100%; border-radius: 1px; transition: width 1s linear, background 0.5s; }
    .state-failed { display: none; flex-direction: column; align-items: center; padding: 0.75rem 0 0.5rem; }
    .fail-title { font-size: 17px; font-weight: 600; color: var(--danger); margin-bottom: 6px; }
    .fail-sub { font-size: 12px; color: var(--text3); line-height: 1.6; text-align: center; max-width: 260px; margin-bottom: 18px; }
    .btn-retry { padding: 10px 22px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; }
    .btn-contact-pay, .contact-back-btn { padding: 10px 22px; background: transparent; border: 1px solid var(--border2); border-radius: 10px; font-size: 13px; color: var(--text2); }
    .contact-hero { text-align: center; margin-bottom: 1.75rem; }
    .contact-title { font-size: 22px; margin-bottom: 6px; }
    .contact-card { border-radius: 16px; overflow: hidden; margin-bottom: 1rem; }
    .contact-item { display: flex; align-items: center; gap: 14px; padding: 16px 18px; text-decoration: none; border-bottom: 1px solid var(--border); }
    .contact-item:last-child { border-bottom: none; }
    .ci-icon { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .ci-icon.tg { background: rgba(36, 161, 222, 0.11); }
    .ci-icon.em { background: var(--accent-soft); }
    .not-found { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4rem 2rem; }
    .not-found h2 { font-size: 32px; margin-bottom: 8px; }
    .url-bar { font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; color: var(--text3); margin-bottom: 2rem; }
    .loading-state { display: flex; align-items: center; justify-content: center; }
    @media (max-width: 640px) {
      .nav, .dash-wrap { padding-left: 1rem; padding-right: 1rem; }
      .mfield-row { grid-template-columns: 1fr; }
      .dash-header { align-items: flex-start; gap: 1rem; flex-direction: column; }
    }
  </style>
</head>
<body>
  <nav class="nav" id="site-nav">
    <div>
    </div>
    <div>
      <button class="btn btn-danger-ghost" id="btn-logout" style="display:none" onclick="doLogout()">Logout</button>
    </div>
  </nav>

  <div class="page" id="page-login">
    <div class="login-wrap">
      <div class="login-card">
        <input class="login-input" type="password" id="login-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="login-err" id="login-err">Incorrect.</div>
        <button class="login-btn" id="login-btn" onclick="doLogin()">Proceed</button>
      </div>
    </div>
  </div>

  <div class="page" id="page-dash">
    <div class="dash-wrap">
      <div class="dash-header">
        <div>
          <div class="dash-title">Payment Forms</div>
          <div class="dash-sub" id="dash-sub"></div>
        </div>
        <button class="btn btn-primary" onclick="openModal()">+ New Form</button>
      </div>
      <div class="forms-grid" id="forms-grid"></div>
    </div>
  </div>

  <div class="page" id="page-404">
    <div class="not-found">
      <div class="url-bar" id="nf-url"></div>
      <h2>Form Not Found</h2>
      <p>No payment form exists at this link.</p>
      <button class="btn btn-primary" onclick="navTo('dashboard')">Go to Dashboard</button>
    </div>
  </div>

  <div class="pay-fullscreen" id="pay-fullscreen">
    <div id="pay-inner"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-title" id="modal-title">Create Payment Form</div>
      <div class="mfield-row">
        <div class="mfield"><label>Company / Brand Name *</label><input type="text" id="m-company" placeholder="Cyameta"></div>
        <div class="mfield"><label>URL Slug *</label><input type="text" id="m-slug" placeholder="paymentpage1" oninput="cleanSlug(this)"></div>
      </div>
      <div class="mfield"><label>Product / Service Name *</label><input type="text" id="m-product" placeholder="DE40 Scalper EA"></div>
      <div class="mfield-row">
        <div class="mfield"><label>Amount (₹) *</label><input type="number" id="m-amount" placeholder="4606" min="1"></div>
        <div class="mfield"><label>Currency Label</label><input type="text" id="m-currency" placeholder="INR" maxlength="5"></div>
      </div>
      <div class="mfield"><label>Logo Image URL (optional)</label><input type="text" id="m-logo" placeholder="https://..."></div>
      <div class="mfield"><label>QR Code Image URL *</label><input type="text" id="m-qr" placeholder="https://..."></div>
      <div class="mfield-row">
        <div class="mfield"><label>Telegram Handle</label><input type="text" id="m-tg" placeholder="@Webenoid"></div>
        <div class="mfield"><label>Support Email</label><input type="text" id="m-email" placeholder="support@example.com"></div>
      </div>
      <div id="modal-err" style="color:var(--danger);font-size:12px;margin-top:4px;display:none;"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveForm()">Save Form</button>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    let editId = null;
    let timerInt = null;
    let currentFormId = null;

    function getToken() { return sessionStorage.getItem('cya_token'); }
    function setToken(token) { sessionStorage.setItem('cya_token', token); }
    function clearToken() { sessionStorage.removeItem('cya_token'); }
    function authed() { return !!getToken(); }
    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken()
      };
    }

    async function apiForms() {
      const response = await fetch(API + '/api/forms', { headers: authHeaders() });
      if (response.status === 401) {
        clearToken();
        navTo('dashboard');
        return [];
      }
      return response.json();
    }

    async function apiFormBySlug(slug) {
      const response = await fetch(API + '/api/public-form?slug=' + encodeURIComponent(slug));
      if (!response.ok) {
        return null;
      }
      return response.json();
    }

    async function apiCreateForm(data) {
      const response = await fetch(API + '/api/forms', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(data)
      });
      return { ok: response.ok, data: await response.json() };
    }

    async function apiUpdateForm(id, data) {
      const response = await fetch(API + '/api/forms?id=' + encodeURIComponent(id), {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify(data)
      });
      return { ok: response.ok, data: await response.json() };
    }

    async function apiDeleteForm(id) {
      const response = await fetch(API + '/api/forms?id=' + encodeURIComponent(id), {
        method: 'DELETE',
        headers: authHeaders()
      });
      return response.ok;
    }

    async function apiSubmit(formId, name, email, phone) {
      try {
        await fetch(API + '/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ form_id: formId, name, email, phone })
        });
      } catch (error) {
        console.warn('Submission save failed:', error);
      }
    }

    function currentSlug() {
      return location.hash.replace(/^#\/?/, '').trim();
    }

    async function route() {
      const slug = currentSlug();
      hidePayFullscreen();

      if (!slug || slug === 'dashboard') {
        if (authed()) {
          renderDash();
          return;
        }
        renderLogin();
        return;
      }

      const form = await apiFormBySlug(slug);
      if (form) {
        renderPayment(form);
        return;
      }

      render404(slug);
    }

    function hidePayFullscreen() {
      document.getElementById('pay-fullscreen').classList.remove('active');
    }

    function navTo(slug) {
      if (currentSlug() === slug) {
        route();
        return;
      }
      location.hash = slug;
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('load', route);

    function showNav(visible) {
      document.getElementById('site-nav').style.display = visible ? 'flex' : 'none';
    }

    function showPage(id) {
      document.querySelectorAll('.page').forEach((page) => page.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function renderLogin() {
      showNav(true);
      document.getElementById('btn-logout').style.display = 'none';
      showPage('page-login');
      document.getElementById('login-pw').value = '';
      document.getElementById('login-err').style.display = 'none';
    }

    async function doLogin() {
      const password = document.getElementById('login-pw').value;
      if (!password) {
        return;
      }

      const button = document.getElementById('login-btn');
      button.disabled = true;
      button.textContent = 'Checking...';

      try {
        const response = await fetch(API + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();
        if (response.ok && data.token) {
          setToken(data.token);
          location.hash = 'dashboard';
        } else {
          const error = document.getElementById('login-err');
          error.textContent = data && data.error ? data.error : 'Incorrect password. Try again.';
          error.style.display = 'block';
          document.getElementById('login-pw').value = '';
        }
      } catch {
        const error = document.getElementById('login-err');
        error.textContent = 'Network error. Try again.';
        error.style.display = 'block';
      }

      button.disabled = false;
      button.textContent = 'Unlock Dashboard';
    }

    function doLogout() {
      clearToken();
      location.hash = 'dashboard';
    }

    async function renderDash() {
      showNav(true);
      document.getElementById('btn-logout').style.display = 'block';
      showPage('page-dash');
      document.getElementById('forms-grid').innerHTML = '<div class="loading-state">Loading forms...</div>';

      const forms = await apiForms();
      document.getElementById('dash-sub').textContent = forms.length + ' form' + (forms.length === 1 ? '' : 's');

      const grid = document.getElementById('forms-grid');
      if (!forms.length) {
        grid.innerHTML = '<div class="empty-state">No payment forms yet. Click + New Form to create one.</div>';
        window._forms = [];
        return;
      }

      grid.innerHTML = forms.map((form) => {
        const logo = form.logo
          ? '<img src="' + esc(form.logo) + '" class="fc-logo" onerror="this.style.display=\'none\'">'
          : '<div class="fc-logo-placeholder">' + esc((form.company || '?')[0].toUpperCase()) + '</div>';

        return '<div class="form-card">' +
          logo +
          '<div class="fc-name">' + esc(form.company) + '</div>' +
          '<div class="fc-product">' + esc(form.product) + '</div>' +
          '<div class="fc-amount">₹' + Number(form.amount).toLocaleString('en-IN') + '</div>' +
          '<div class="fc-slug">/' + esc(form.slug) + '</div>' +
          '<div class="fc-actions">' +
            '<button class="fc-btn fc-btn-view" onclick="navTo(\'' + esc(form.slug) + '\')">View Link</button>' +
            '<button class="fc-btn fc-btn-edit" onclick="openModal(\'' + esc(form.id) + '\')">Edit</button>' +
            '<button class="fc-btn fc-btn-del" onclick="deleteForm(\'' + esc(form.id) + '\')">Delete</button>' +
          '</div>' +
        '</div>';
      }).join('');

      window._forms = forms;
    }

    function openModal(id) {
      editId = id || null;
      document.getElementById('modal-title').textContent = id ? 'Edit Payment Form' : 'Create Payment Form';
      document.getElementById('modal-err').style.display = 'none';

      if (id && window._forms) {
        const form = window._forms.find((entry) => entry.id === id);
        if (form) {
          document.getElementById('m-company').value = form.company || '';
          document.getElementById('m-slug').value = form.slug || '';
          document.getElementById('m-product').value = form.product || '';
          document.getElementById('m-amount').value = form.amount || '';
          document.getElementById('m-currency').value = form.currency || 'INR';
          document.getElementById('m-logo').value = form.logo || '';
          document.getElementById('m-qr').value = form.qr || '';
          document.getElementById('m-tg').value = form.telegram || '';
          document.getElementById('m-email').value = form.email || '';
        }
      } else {
        ['m-company', 'm-slug', 'm-product', 'm-amount', 'm-logo', 'm-qr', 'm-tg', 'm-email'].forEach((idValue) => {
          document.getElementById(idValue).value = '';
        });
        document.getElementById('m-currency').value = 'INR';
      }

      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function cleanSlug(element) {
      element.value = element.value.toLowerCase().replace(/[^a-z0-9-_]/g, '');
    }

    async function saveForm() {
      const company = document.getElementById('m-company').value.trim();
      const slug = document.getElementById('m-slug').value.trim();
      const product = document.getElementById('m-product').value.trim();
      const amount = document.getElementById('m-amount').value.trim();
      const currency = document.getElementById('m-currency').value.trim() || 'INR';
      const logo = document.getElementById('m-logo').value.trim();
      const qr = document.getElementById('m-qr').value.trim();
      const telegram = document.getElementById('m-tg').value.trim();
      const email = document.getElementById('m-email').value.trim();
      const error = document.getElementById('modal-err');

      if (!company || !slug || !product || !amount || !qr) {
        error.textContent = 'Please fill all required fields.';
        error.style.display = 'block';
        return;
      }

      const button = document.getElementById('save-btn');
      button.disabled = true;
      button.textContent = 'Saving...';

      const payload = { company, slug, product, amount: Number(amount), currency, logo, qr, telegram, email };
      const result = editId ? await apiUpdateForm(editId, payload) : await apiCreateForm(payload);

      button.disabled = false;
      button.textContent = 'Save Form';

      if (!result.ok) {
        error.textContent = result.data && result.data.error ? result.data.error : 'Save failed.';
        error.style.display = 'block';
        return;
      }

      closeModal();
      renderDash();
    }

    async function deleteForm(id) {
      if (!confirm('Delete this payment form?')) {
        return;
      }

      await apiDeleteForm(id);
      renderDash();
    }

    function render404(slug) {
      showNav(true);
      document.getElementById('btn-logout').style.display = authed() ? 'block' : 'none';
      showPage('page-404');
      document.getElementById('nf-url').textContent = location.origin + location.pathname + '#' + slug;
    }

    function renderPayment(form) {
      clearInterval(timerInt);
      currentFormId = form.id;
      window._currentAmount = form.amount;
      showNav(false);
      document.querySelectorAll('.page').forEach((page) => page.classList.remove('active'));
      document.getElementById('pay-fullscreen').classList.add('active');

      const telegram = form.telegram
        ? '<a class="contact-item" href="https://t.me/' + esc(form.telegram.replace('@', '')) + '" target="_blank" rel="noopener">' +
            '<div class="ci-icon tg">T</div><div><div class="ci-label">Telegram</div><div>' + esc(form.telegram) + '</div></div>' +
          '</a>'
        : '';
      const email = form.email
        ? '<a class="contact-item" href="mailto:' + esc(form.email) + '">' +
            '<div class="ci-icon em">@</div><div><div class="ci-label">Email</div><div>' + esc(form.email) + '</div></div>' +
          '</a>'
        : '';

      document.getElementById('pay-inner').innerHTML = `
        <div class="pay-card">
          <div class="pay-head">
            <div class="pay-brand">
              ${form.logo ? '<img src="' + esc(form.logo) + '" class="pay-brand-img">' : '<div class="pay-brand-mark">C</div>'}
              <div class="pay-brand-name">${esc(form.company)}</div>
            </div>
            <div>Secure</div>
          </div>
          <div class="stepper">
            <div class="step-dot active" id="dot1"></div><div class="step-line"></div>
            <div class="step-dot" id="dot2"></div><div class="step-line"></div>
            <div class="step-dot" id="dot3"></div>
          </div>
          <div id="sc1">
            <div class="pay-body">
              <div class="order-summary">
                <div class="order-tag">Order Summary</div>
                <div class="order-product">${esc(form.product)}</div>
                <div class="order-divider"></div>
                <div class="order-total-row">
                  <div>Total payable</div>
                  <div class="order-total-amount">₹${Number(form.amount).toLocaleString('en-IN')}</div>
                </div>
              </div>
              <div class="section-title">Your details</div>
              <div class="pf">
                <div class="pf-label">Full name *</div>
                <input type="text" id="fi-name" placeholder="Aakash Sharma">
                <div class="err-msg" id="fe-name">Please enter your full name</div>
              </div>
              <div class="pf">
                <div class="pf-label">Email address *</div>
                <input type="email" id="fi-email" placeholder="you@example.com">
                <div class="err-msg" id="fe-email">Please enter a valid email address</div>
              </div>
              <div class="pf">
                <div class="pf-label">Phone number *</div>
                <div class="pf-row">
                  <div class="prefix-box">+91</div>
                  <input type="tel" id="fi-phone" placeholder="9876543210" maxlength="10" style="flex:1">
                </div>
                <div class="err-msg" id="fe-phone">Enter a valid 10-digit phone number</div>
              </div>
              <button class="pay-btn" id="pay-submit-btn" onclick="payValidate()">Pay ₹${Number(form.amount).toLocaleString('en-IN')} via UPI</button>
              <div class="foot-note">Customer details are saved before showing the QR.</div>
            </div>
          </div>
          <div id="sc2" style="display:none">
            <div class="pay-body">
              <div class="back-row" onclick="payBack()">Back</div>
              <div class="user-greeting">
                <div class="avatar" id="p-init">A</div>
                <div>
                  <div id="p-name">Hey, User</div>
                  <div id="p-sub" class="dash-sub">Complete your payment below</div>
                </div>
              </div>
              <div class="qr-box">
                <div id="qr-state">
                  <div class="qr-amount">₹${Number(form.amount).toLocaleString('en-IN')}</div>
                  <div class="qr-hint">Open any UPI app, scan the QR, and complete payment before the timer ends.</div>
                  <div class="payment-status"><span class="status-ping"></span>Waiting for payment confirmation</div>
                  <div class="qr-frame"><img class="qr-img" src="${esc(form.qr)}" alt="UPI QR Code"></div>
                  <div class="upi-apps"><span class="upi-chip">GPay</span><span class="upi-chip">PhonePe</span><span class="upi-chip">Paytm</span></div>
                  <div class="timer-track"><div class="timer-fill" id="t-bar" style="width:100%;background:var(--accent)"></div></div>
                  <div class="timer-label">QR expires in <span id="t-cd">10:00</span></div>
                </div>
                <div class="state-failed" id="fail-state">
                  <div class="fail-title">Payment Failed</div>
                  <div class="fail-sub">The 10-minute window ended and no payment was received.</div>
                  <div class="fail-actions">
                    <button class="btn-retry" onclick="payRetry()">Try Again</button>
                    <button class="btn-contact-pay" onclick="payContact()">Contact Support</button>
                  </div>
                </div>
              </div>
              <div class="trouble-txt">Need help? <a href="#" onclick="payContact();return false;">Contact support</a></div>
            </div>
          </div>
          <div id="sc3" style="display:none">
            <div class="pay-body">
              <div class="contact-hero">
                <div class="contact-title">Need Help?</div>
                <div class="contact-sub">Reach out and we will verify your payment.</div>
              </div>
              <div class="contact-card">
                ${telegram}${email}${!telegram && !email ? '<div class="contact-item">No contact details set for this form.</div>' : ''}
              </div>
              <button class="contact-back-btn" onclick="payBackQR()">Back to payment</button>
            </div>
          </div>
        </div>
      `;
    }

    function pShowStep(step) {
      [1, 2, 3].forEach((value) => {
        const dot = document.getElementById('dot' + value);
        if (dot) {
          dot.className = 'step-dot';
          if (value < step) {
            dot.classList.add('done');
          } else if (value === step) {
            dot.classList.add('active');
          }
        }

        const section = document.getElementById('sc' + value);
        if (section) {
          section.style.display = value === step ? 'block' : 'none';
        }
      });
    }

    async function payValidate() {
      const name = document.getElementById('fi-name').value.trim();
      const email = document.getElementById('fi-email').value.trim();
      const phone = document.getElementById('fi-phone').value.trim();

      let valid = true;
      function check(inputId, errorId, failed) {
        const input = document.getElementById(inputId);
        const error = document.getElementById(errorId);
        if (failed) {
          error.classList.add('show');
          input.style.borderColor = 'var(--danger)';
          valid = false;
        } else {
          error.classList.remove('show');
          input.style.borderColor = 'var(--border)';
        }
      }

      check('fi-name', 'fe-name', !name || name.length < 2);
      check('fi-email', 'fe-email', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
      check('fi-phone', 'fe-phone', !/^[6-9]\d{9}$/.test(phone));

      if (!valid) {
        return;
      }

      const button = document.getElementById('pay-submit-btn');
      button.disabled = true;
      await apiSubmit(currentFormId, name, email, phone);
      await storeSession(phone, email);
      button.disabled = false;

      document.getElementById('p-init').textContent = name[0].toUpperCase();
      document.getElementById('p-name').textContent = 'Hey, ' + name.split(' ')[0];
      document.getElementById('p-sub').textContent = '+91 ' + phone + ' · ' + email;

      setQRState('qr');
      pShowStep(2);
      startTimer();    }

    function payBack() {
      clearInterval(timerInt);
      pShowStep(1);
    }

    function payContact() {
      pShowStep(3);
    }

    function payBackQR() {
      pShowStep(2);
    }

    function payRetry() {
      clearInterval(timerInt);
      setQRState('qr');
      document.getElementById('t-bar').style.width = '100%';
      document.getElementById('t-bar').style.background = 'var(--accent)';
      document.getElementById('t-cd').textContent = '10:00';
      pShowStep(2);
      startTimer();
    }

    function setQRState(state) {
      document.getElementById('qr-state').style.display = state === 'qr' ? 'block' : 'none';
      document.getElementById('fail-state').style.display = state === 'failed' ? 'flex' : 'none';
    }

    function startTimer() {
      clearInterval(timerInt);
      let left = 600;
      const bar = document.getElementById('t-bar');
      const label = document.getElementById('t-cd');
      timerInt = setInterval(() => {
        left -= 1;
        const pct = left / 600;
        bar.style.width = Math.max(0, pct * 100).toFixed(2) + '%';
        label.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
        if (left <= 0) {
          clearInterval(timerInt);
          label.textContent = 'Expired';
          setQRState('failed');
          document.getElementById('dot1').className = 'step-dot done';
          document.getElementById('dot2').className = 'step-dot done';
          document.getElementById('dot3').className = 'step-dot active';
        }
      }, 1000);
    }

    function esc(value) {
      if (!value) {
        return '';
      }
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
function getCookie(name) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
  return null;
}

async function storeSession(phone, email) {
  try {
    const fbp = getCookie('_fbp') || null;
    let fbc = getCookie('_fbc') || null;
    if (!fbc) {
      const fbclid = new URLSearchParams(window.location.search).get('fbclid');
      if (fbclid) fbc = `fb.1.${Date.now()}.${fbclid}`;
    }
    let ip = null;
    try {
      const ipRes = await fetch('https://api.ipify.org?format=json');
      ip = (await ipRes.json()).ip;
    } catch(e) {}
    await fetch('https://de40finorapaypurchaseventsetup-production.up.railway.app/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, email, fbp, fbc, ip, userAgent: navigator.userAgent }),
    });
  } catch(e) { console.warn('Session store failed:', e); }
}

  </script>
